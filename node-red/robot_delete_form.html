<style>
    .form-rbt-del-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-rbt-del-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-rbt-del-group-destac {
        background: rgb(233, 232, 232);
        width: 93%;
        margin: 0 auto;
        display: block;
        border: 2px solid #007bff;
        padding: 10px;
        border-radius: 5px;
    }
    .form-rbt-del-group.full-width {
        grid-column: span 2;
    }
    .form-rbt-del-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-rbt-del-group input, 
    .form-rbt-del-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .submit-rbt-del-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-rbt-del-btn:hover {
        background: #0056b3;
    }

    .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #007bff;
    }
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        width: 100px;
        height: 100px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        display: block;
    }
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loading-rbt-del" class="loading">
    <div class="spinner"></div>
</div>

<form id="form-rbt-del" class="form-rbt-del-container">
    <div class="form-rbt-del-group form-rbt-del-group-destac full-width">
        <label>Select Robot:</label>
        <select id="robotId-rbt-del" style="width: 100%; font-style: italic; font-weight: bold;" required></select>
    </div>
    <hr style="grid-column: span 2; border: 1.5px solid #ccc; margin: 5px 0;">
    <div class="form-rbt-del-group full-width">
        <label>Id:</label>
        <input type="text" id="id-rbt-del" placeholder="Id of the robot" disabled>
    </div>
    <div class="form-rbt-del-group full-width">
        <label>Name:</label>
        <input type="text" id="name-rbt-del" placeholder="Name of the robot" disabled>
    </div>

    <button id="submitBtn-rbt-del" type="button" class="form-rbt-del-group submit-rbt-del-btn full-width" onclick="submitFormRobotDelete()">Delete</button>
</form>

<script>
    (function(scope) {
        function populateDropdownsRobotDelete(inputs) {
            if (inputs.robots && inputs.robots.options) {
                var dropdownRobots = document.getElementById("robotId-rbt-del");
                dropdownRobots.innerHTML = '<option value="">Select a robot to update</option>';
                inputs.robots.options.forEach((option) => {
                    var opt = document.createElement("option");
                    opt.value = option.value;
                    opt.textContent = option.label;
                    dropdownRobots.appendChild(opt);
                });
            }
        }        

        function populateForm(robot) {
            document.getElementById("id-rbt-del").value = robot._id || '';
            document.getElementById("name-rbt-del").value = robot.name || '';
        }

        //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
        
        document.getElementById("robotId-rbt-del").addEventListener("change", function() {
            var robotId = this.value;
            if (robotId) {
                var loadingElement = document.getElementById("loading-rbt-del");
                loadingElement.style.display = 'block';
                fetch(`http://192.168.99.21:5000/robots/${robotId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Dados recebidos do servidor:', data);
                    populateForm(data);
                    scope.msg.payload.robot = data;
                    loadingElement.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error fetching robot data:', error);
                    loadingElement.style.display = 'none';
                    if (error.message.includes('Failed to fetch')) {
                        alert('Erro ao conectar ao servidor. Por favor, verifique se o servidor está em execução.');
                    }
                });
            }
        });

        //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////        

        document.getElementById("submitBtn-rbt-del").addEventListener("click", submitFormRobotDelete);

        function submitFormRobotDelete() {
            var form = document.getElementById("form-rbt-del");
            var requiredFields = form.querySelectorAll("[required]");
            var missingFields = [];

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    missingFields.push(field.previousElementSibling?.textContent || "Campo obrigatório");
                }
            });
            if (missingFields.length > 0) {
                alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
                return;
            }

            var formData = {
                id: document.getElementById("id-rbt-del").value,
                name: document.getElementById("name-rbt-del").value
            };

            scope.send({ payload: formData });
            
            // form.reset();
        }

        window.submitFormRobotDelete = submitFormRobotDelete;
        
        scope.$watch('msg.payload', function(msg) {
            populateDropdownsRobotDelete(msg);
        });
    })(scope);
</script>
