<style>
    .form-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-group input, 
    .form-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .form-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 5px;
    }
    .form-group input[type="range"] {
        width: 100%;
    }
    .form-group input[type="radio"] {
        margin-right: 5px;
    }
    .submit-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-btn:hover {
        background: #0056b3;
    }
    .parameter-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }
    .parameter-item input, .parameter-item select {
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .remove-btn {
        background: red;
        color: white;
        border: none;
        cursor: pointer;
        padding: 5px;
        border-radius: 4px;
    }
</style>

<form id="formulario" class="form-container">
    <div class="form-group">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Name of the robot" required>
    </div>
    <div class="form-group">
        <label>Lifetime:</label>
        <input type="number" id="lifetime" min="0" placeholder="Lifetime of the robot in milliseconds. A value of 0 indicates an indefinite lifetime" required>
    </div>    
    <div class="form-group">
        <label>Operation Cycle Time:</label>
        <input type="number" id="operationCycleTime" min="0" placeholder="Operation cycle time of the robot in milliseconds" required>
    </div>    
    <div class="form-group">
        <label>Trade Market:</label>
        <select id="tradeMarket"></select>
    </div>    
    <div class="form-group">
        <label>Initial Capital:</label>
        <input type="number" id="initialCapital" min="0" placeholder="Initial capital allocated to the robot" required>
    </div>
    <div class="form-group">
        <label>Stop Loss:</label>
        <input type="number" id="stopLoss" min="0" placeholder="Stop loss threshold for the robot. A value 0 indicates no stop loss" required>
    </div>
    <div class="form-group">
        <label>Stop Gain:</label>
        <input type="number" id="stopGain" min="0" placeholder="Stop gain threshold for the robot. A value 0 indicates no stop loss." required>
    </div>
    <div class="form-group">
        <label>Broker:</label>
        <select id="brokerId" required></select>
    </div>
    <div class="form-group">
        <label>Trade Strategies:</label>
        <select id="tradeStrategyId" multiple required></select>
    </div>
    <div class="form-group">
        <label>Currency Symbol:</label>
        <select id="currencySymbol" required></select>
    </div>
    <div class="form-group">
        <label>Simulation Mode:</label>
        <input type="checkbox" id="simulationMode">
    </div>
    <div class="form-group">
        <label>Additional Parameters:</label>
        <div id="parameterContainer"></div>
        <button type="button" class="add-btn" onclick="addParameter()">+ Add Parameter</button>
    </div>
    <div class="form-group">
        <label><input type="checkbox" id="manterDados"> Manter dados após envio</label>
    </div>

    <button id="submitBtn" type="button" class="submit-btn" onclick="submitForm()">Enviar</button>
</form>

<script>
    (function(scope) {
        function populateDropdowns(inputs) {
            console.log('--- INPUTS', inputs);

            if (inputs.tradeMarkets && inputs.tradeMarkets.options) {
                var dropdownTradeMarket = document.getElementById("tradeMarket");
                dropdownTradeMarket.innerHTML = '<option value="">Select Trade market associated with the robot</option>';
                inputs.tradeMarkets.options.forEach((option) => {
                    var opt = document.createElement("option");
                    opt.value = option.value;
                    opt.textContent = option.label;
                    dropdownTradeMarket.appendChild(opt);
                });
                if (inputs.tradeMarkets.selected) dropdownTradeMarket.value = inputs.tradeMarkets.selected;
            }
            if (inputs.brokers && inputs.brokers.options) {
                var dropdownBrokers = document.getElementById("brokerId");
                dropdownBrokers.innerHTML = '<option value="">Select the broker used by the robot.</option>';
                inputs.brokers.options.forEach((option) => {
                    var opt = document.createElement("option");
                    opt.value = option.value;
                    opt.textContent = option.label;
                    dropdownBrokers.appendChild(opt);
                });
                if (inputs.brokers.selected) dropdownBrokers.value = inputs.brokers.selected;
            }
            if (inputs.tradeStrategies && inputs.tradeStrategies.options) {
                var dropdownTradeStrategies = document.getElementById("tradeStrategyId");
                dropdownTradeStrategies.innerHTML = '';
                inputs.tradeStrategies.options.forEach((option) => {
                    var opt = document.createElement("option");
                    opt.value = option.value;
                    opt.textContent = option.label;
                    dropdownTradeStrategies.appendChild(opt);
                });
                if (inputs.tradeStrategies.selected) {
                    inputs.tradeStrategies.selected.forEach(selectedValue => {
                        let option = dropdownTradeStrategies.querySelector(`option[value="${selectedValue}"]`);
                        if (option) option.selected = true;
                    });
                }
            }
            if (inputs.currencySymbol && inputs.currencySymbol.options) {
                var dropdownCurrencySymbol = document.getElementById("currencySymbol");
                dropdownCurrencySymbol.innerHTML = '<option value="">Select the currency symbol used by the robot</option>';
                inputs.currencySymbol.options.forEach((option) => {
                    var opt = document.createElement("option");
                    opt.value = option.value;
                    opt.textContent = option.label;
                    dropdownCurrencySymbol.appendChild(opt);
                });
                if (inputs.currencySymbol.selected) dropdownCurrencySymbol.value = inputs.currencySymbol.selected;
            }
        }
        function getSelectedTradeStrategies() {
            let selectedOptions = document.getElementById("tradeStrategyId").selectedOptions;
            return Array.from(selectedOptions).map(option => option.value);
        }


        function addParameter() {
            var container = document.getElementById("parameterContainer");

            var div = document.createElement("div");
            div.classList.add("parameter-item");

            div.innerHTML = `
                <input type="text" placeholder="Name" class="param-name" required>
                <input type="text" placeholder="Key" class="param-key" required>
                <select class="param-type">
                    <option value="string">String</option>
                    <option value="number">Number</option>
                </select>
                <input type="text" placeholder="Description (optional)" class="param-description">
                <input type="text" placeholder="Value" class="param-value" required>
                <button type="button" class="remove-btn" onclick="removeParameter(this)">❌</button>
            `;

            container.appendChild(div);
        }
        function removeParameter(button) {
            button.parentElement.remove();
        }
        function getParameters() {
            var params = [];
            document.querySelectorAll(".parameter-item").forEach(item => {
                var param = {
                    name: item.querySelector(".param-name").value,
                    key: item.querySelector(".param-key").value,
                    type: item.querySelector(".param-type").value,
                    description: item.querySelector(".param-description").value || undefined,
                    value: item.querySelector(".param-value").value
                };
                params.push(param);
            });
            return params;
        }


        function submitForm() {
            var form = document.getElementById("formulario");
            var requiredFields = form.querySelectorAll("[required]");
            var missingFields = [];

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    missingFields.push(field.previousElementSibling?.textContent || "Campo obrigatório");
                }
            });

            if (missingFields.length > 0) {
                alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
                return;
            }

            var formData = {                
                name: document.getElementById("name").value,
                lifetime: document.getElementById("lifetime").value,
                operationCycleTime: document.getElementById("operationCycleTime").value,
                tradeMarket: document.getElementById("tradeMarket").value,
                initialCapital: document.getElementById("initialCapital").value,
                stopLoss: document.getElementById("stopLoss").value,
                stopGain: document.getElementById("stopGain").value,
                brokerId: document.getElementById("brokerId").value,
                tradeStrategyId: getSelectedTradeStrategies(),
                currencySymbol: document.getElementById("currencySymbol").value,
                simulationMode: document.getElementById("simulationMode").checked ,
                otherParams: getParameters()
            };

            scope.send({ payload: formData });

            if (!document.getElementById("manterDados").checked) {
                form.reset();
            }
        }
        
        scope.$watch('msg.payload', function(msg) {
            populateDropdowns(msg);
        });

        document.getElementById("submitBtn").addEventListener("click", submitForm);
    })(scope);
</script>
