<form id="formulario" class="form-container">
    <div class="form-group">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Name of the robot" required>
    </div>    
    <div class="form-group">
        <label>Lifetime:</label>
        <input type="number" id="lifetime" min="0" placeholder="Lifetime of the robot in milliseconds. A value of 0 indicates an indefinite lifetime" required>
    </div>    
    <div class="form-group">
        <label>Operation Cycle Time:</label>
        <input type="number" id="operationCycleTime" min="0" placeholder="Operation cycle time of the robot in milliseconds" required>
    </div>    
    <div class="form-group">
        <label>Trade Market:</label>
        <select id="tradeMarket"></select>
    </div>    
    <div class="form-group">
        <label>Initial Capital:</label>
        <input type="number" id="initialCapital" min="0" placeholder="Initial capital allocated to the robot" required>
    </div>
    <div class="form-group">
        <label>Stop Loss:</label>
        <input type="number" id="stopLoss" min="0" placeholder="Stop loss threshold for the robot. A value 0 indicates no stop loss" required>
    </div>
    <div class="form-group">
        <label>Stop Gain:</label>
        <input type="number" id="stopGain" min="0" placeholder="Stop gain threshold for the robot. A value 0 indicates no stop loss." required>
    </div>
    <div class="form-group">
        <label>Broker:</label>
        <input type="text" id="brokerId" placeholder="Identifier of the broker associated with the robot" required>
    </div>    
    <div class="form-group">
        <label>Trade Strategies:</label>
        <select id="tradeStrategyId"></select>
    </div>    




    <div class="form-group">
        <label><input type="checkbox" id="manterDados"> Manter dados após envio</label>
    </div>

    <button id="submitBtn" type="button" class="submit-btn" onclick="submitForm()">Enviar</button>
</form>


<script>
    (function(scope) {
        function populateDropdowns(inputs) {
            console.log('--- INPUTS',inputs);

            var dropdownTradeMarket = document.getElementById("tradeMarket");
            dropdownTradeMarket.innerHTML = '<option value="">Select Trade market associated with the robot</option>';
            inputs.tradeMarkets.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeMarket.appendChild(opt);
            });
            if (inputs.tradeMarkets.selected) dropdownTradeMarket.value = inputs.tradeMarkets.selected;
            
            var dropdownTradeStrategies = document.getElementById("tradeStrategyId");
            dropdownTradeStrategies.innerHTML = '<option value="">Select trade strategies identifiers used by the robot</option>';
            inputs.tradeStrategies.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeStrategies.appendChild(opt);
            });
            if (inputs.tradeStrategies.selected) dropdownTradeStrategies.value = inputs.tradeStrategies.selected;
        }

        function submitForm() {
            var form = document.getElementById("formulario");
            var requiredFields = form.querySelectorAll("[required]");
            var missingFields = [];

            requiredFields.forEach(field => {
                if (!field.value.trim()) {
                    missingFields.push(field.previousElementSibling?.textContent || "Campo obrigatório");
                }
            });

            if (missingFields.length > 0) {
                alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
                return;
            }

            var formData = {
                name: document.getElementById("name").value,
                lifetime: document.getElementById("lifetime").value,
                operationCycleTime: document.getElementById("operationCycleTime").value,
                tradeMarket: document.getElementById("tradeMarket").value
            };

            scope.send({ payload: formData });

            if (!document.getElementById("manterDados").checked) {
                form.reset();
            }
        }
        
        scope.$watch('msg.payload', function(msg) {
            populateDropdowns(msg);
        });

        document.getElementById("submitBtn").addEventListener("click", submitForm);
    })(scope);
</script>
