version: '3.7'

services:
  backend:
    build:
      context: .
      dockerfile: ${SERVICE_FOLDER_PATH}/Dockerfile
    image: ${BACKEND_NAME}:${BACKEND_VERSION}
    container_name: ${SERVICE_DOCKER_NAME}_${BACKEND_SERVICE_NAME}
    env_file: .env
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${BACKEND_URL}:${BACKEND_PORT}']
      interval: 50s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    volumes:
      - .:/home/node/app
      - ${BACKEND_LOGS_DIR}:${BACKEND_LOGS_DIR}
    networks:
      - project-network

networks:
  project-network:
    name: ${PROJECT_NAME}
    driver: bridge
