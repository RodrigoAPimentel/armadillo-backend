<style>
    .form-rbt-del-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-rbt-del-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-rbt-del-group-destac {
        background: rgb(233, 232, 232);
        width: 93%;
        margin: 0 auto;
        display: block;
        border: 2px solid #007bff;
        padding: 10px;
        border-radius: 5px;
    }
    .form-rbt-del-group-destac-font {
        font-style: italic;
        font-weight: bold;
    }
    .form-rbt-del-group.full-width {
        grid-column: span 2;
    }
    .form-rbt-del-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-rbt-del-group input, 
    .form-rbt-del-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .form-rbt-del-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 5px;
    }
    .form-rbt-del-group input[type="range"] {
        width: 100%;
    }
    .form-rbt-del-group input[type="radio"] {
        margin-right: 5px;
    }
    .submit-rbt-del-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-rbt-del-btn:hover {
        background: #0056b3;
    }
    .submit-rbt-del-btn {
        background: #fc2929;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-rbt-del-btn:hover {
        background:  #ff0000;
    }

    .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #007bff;
    }
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        width: 100px;
        height: 100px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        display: block;
    }
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loading-rbt-del" class="loading">
    <div class="spinner"></div>
</div>

<form id="form-rbt-del" class="form-rbt-del-container">
    <div class="form-rbt-del-group form-rbt-del-group-destac full-width">
        <label>Select Robot:</label>
        <select id="select-rbt-rbt-del" style="width: 100%; font-style: italic; font-weight: bold;" required></select>
    </div>
    <hr style="grid-column: span 2; border: 1.5px solid #ccc; margin: 5px 0;">
    <div class="form-rbt-del-group full-width">
        <label>Name:</label>
        <input type="text" id="name-rbt-del" placeholder="Name of the robot" required disabled>
    </div>
    <div class="form-rbt-del-group full-width">
        <label>Trade Market:</label>
        <select id="tradeMarket-rbt-del" disabled></select>
    </div>    
    <div class="form-rbt-del-group full-width">
        <label>Broker:</label>
        <select id="brokerId-rbt-del" required disabled></select>
    </div>
    <div class="form-rbt-del-group full-width">
        <label>Simulation Mode: <input type="checkbox" id="simulationMode-rbt-del" disabled></label>        
    </div>

    <button id="submitBtn-rbt-del" type="button" class="form-rbt-del-group submit-rbt-del-btn full-width">Delete</button>
</form>

<script>
    const globalThisReference = this;
    var scope = globalThisReference.scope || {};

    function populateDropdownsRobotUpdate(inputs) {
        if (inputs.robots && inputs.robots.options) {
            var dropdownRobots = document.getElementById("select-rbt-rbt-del");
            dropdownRobots.innerHTML = '<option value="">Select a robot to update</option>';
            inputs.robots.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownRobots.appendChild(opt);
            });
        }
        if (inputs.tradeMarkets && inputs.tradeMarkets.options) {
            var dropdownTradeMarket = document.getElementById("tradeMarket-rbt-del");
            dropdownTradeMarket.innerHTML = '<option value="">Select Trade market associated with the robot</option>';
            inputs.tradeMarkets.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeMarket.appendChild(opt);
            });
            if (inputs.tradeMarkets.selected) dropdownTradeMarket.value = inputs.tradeMarkets.selected;
        }
        if (inputs.brokers && inputs.brokers.options) {
            var dropdownBrokers = document.getElementById("brokerId-rbt-del");
            dropdownBrokers.innerHTML = '<option value="">Select the broker used by the robot.</option>';
            inputs.brokers.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownBrokers.appendChild(opt);
            });
            if (inputs.brokers.selected) dropdownBrokers.value = inputs.brokers.selected;
        }
    }

    function populateForm(robot) {
        document.getElementById("name-rbt-del").value = robot.name || '';
        document.getElementById("tradeMarket-rbt-del").value = robot.tradeMarket || '';
        document.getElementById("brokerId-rbt-del").value = robot.brokerId || '';
        document.getElementById("simulationMode-rbt-del").checked = robot.simulationMode || false;        
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    document.getElementById("select-rbt-rbt-del").addEventListener("change", loadRobots);
    
    function loadRobots() {            
        var robotId = this.value;
        if (robotId) {
            var loadingElement = document.getElementById("loading-rbt-del");
            loadingElement.style.display = 'block';
            fetch(`http://192.168.99.21:5000/robots/${robotId}`, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Dados recebidos do servidor:', data);
                populateForm(data);
                scope.msg = scope.msg || {}; // Garante que scope.msg está definido.
                scope.msg.payload = scope.msg.payload || {}; // Garante que scope.msg.payload está definido.
                scope.msg.payload.robot = data;
                loadingElement.style.display = 'none';
            })
            .catch(error => {
                console.error('Error fetching robot data:', error);
                loadingElement.style.display = 'none';
                if (error.message.includes('Failed to fetch')) {
                    alert('Erro ao conectar ao servidor. Por favor, verifique se o servidor está em execução.');
                }
            });
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        loadRobots.call(document.getElementById("select-rbt-rbt-del"));
    });

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    document.getElementById("submitBtn-rbt-del").addEventListener("click", submitFormRobotDelete);
    
    function submitFormRobotDelete() {
        var form = document.getElementById("form-rbt-del");
        var requiredFields = document.getElementById("select-rbt-rbt-del");
        var missingFields = [];

        if (!requiredFields.value.trim()) {
            missingFields.push(requiredFields.previousElementSibling?.textContent || "Campo obrigatório");
        } 
        if (missingFields.length > 0) {
            alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
            return;
        }

        if (!confirm(`Tem certeza de que deseja deletar o robô "${scope.msg.payload.robot.name}"?`)) {
            return;
        }

        globalThisReference.send({ 
            robot_id: scope.msg.payload.robot._id, 
            is_delete: true 
        });

        var dropdownRobots = document.getElementById("select-rbt-rbt-del");
        var selectedOption = dropdownRobots.querySelector(`option[value="${scope.msg.payload.robot._id}"]`);
        if (selectedOption) selectedOption.remove();

        form.reset();
    }
    
    globalThisReference.$socket.on('msg-input:' + globalThisReference.id, (msg) => {
        console.log('[Robots - Delete] Inputs:', msg.payload);
        if (msg.payload) {
            populateDropdownsRobotUpdate(msg.payload);
        }
    });
</script>
