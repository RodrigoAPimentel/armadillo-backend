<style>
    .form-trs-del-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-trs-del-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-trs-del-group-destac {
        background: rgb(233, 232, 232);
        width: 93%;
        margin: 0 auto;
        display: block;
        border: 2px solid #007bff;
        padding: 10px;
        border-radius: 5px;
    }
    .form-trs-del-group-destac-font {
        font-style: italic;
        font-weight: bold;
    }
    .form-trs-del-group.full-width {
        grid-column: span 2;
    }
    .form-trs-del-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-trs-del-group input, 
    .form-trs-del-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .form-trs-del-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 5px;
    }
    .form-trs-del-group input[type="range"] {
        width: 100%;
    }
    .form-trs-del-group input[type="radio"] {
        margin-right: 5px;
    }
    .submit-trs-del-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-trs-del-btn:hover {
        background: #0056b3;
    }
    .submit-trs-del-btn {
        background: #fc2929;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-trs-del-btn:hover {
        background:  #ff0000;
    }

    .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #007bff;
    }
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        width: 100px;
        height: 100px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        display: block;
    }
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loading-trs-del" class="loading">
    <div class="spinner"></div>
</div>

<form id="form-trs-del" class="form-trs-del-container">
    <div class="form-trs-del-group form-trs-del-group-destac full-width">
        <label>Select Trade Strategy:</label>
        <select id="select-trs-trs-del" style="width: 100%; font-style: italic; font-weight: bold;" required></select>
    </div>
    <hr style="grid-column: span 2; border: 1.5px solid #ccc; margin: 5px 0;">
    <div class="form-trs-del-group full-width">
        <label>Name:</label>
        <input type="text" id="name-trs-del" placeholder="Name of the tradeStrategy" required disabled>
    </div>
    <div class="form-trs-del-group full-width">
        <label>Acronym:</label>
        <input type="text" id="acronym-trs-del" placeholder="Acronym of the Trade Strategy" required disabled>
    </div>

    <button id="submitBtn-trs-del" type="button" class="form-trs-del-group submit-trs-del-btn full-width">Delete</button>
</form>

<script>
    const globalThisReference = this;
    var scope = globalThisReference.scope || {};

    function populateDropdownsTradeStrategiesDelete(inputs) {
        if (inputs.tradeStrategies && inputs.tradeStrategies.options) {
            var dropdownTradeStrategies = document.getElementById("select-trs-trs-del");
            dropdownTradeStrategies.innerHTML = '<option value="">Select a Trade Strategy to update</option>';
            inputs.tradeStrategies.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeStrategies.appendChild(opt);
            });
        }
    }

    function populateForm(tradeStrategy) {
        document.getElementById("name-trs-del").value = tradeStrategy.name || '';
        document.getElementById("acronym-trs-del").value = tradeStrategy.acronym || '';
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    document.getElementById("select-trs-trs-del").addEventListener("change", loadTradeStrategies);
    
    function loadTradeStrategies() {            
        var tradeStrategiesId = this.value;
        if (tradeStrategiesId) {
            var loadingElement = document.getElementById("loading-trs-del");
            loadingElement.style.display = 'block';
            fetch(`http://192.168.99.21:5000/tradeStrategies/${tradeStrategiesId}`, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Dados recebidos do servidor:', data);
                populateForm(data);
                scope.msg = scope.msg || {}; // Garante que scope.msg está definido.
                scope.msg.payload = scope.msg.payload || {}; // Garante que scope.msg.payload está definido.
                scope.msg.payload.tradeStrategy = data;
                loadingElement.style.display = 'none';
            })
            .catch(error => {
                console.error('Error fetching tradeStrategy data:', error);
                loadingElement.style.display = 'none';
                if (error.message.includes('Failed to fetch')) {
                    alert('Erro ao conectar ao servidor. Por favor, verifique se o servidor está em execução.');
                }
            });
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        loadTradeStrategies.call(document.getElementById("select-trs-trs-del"));
    });

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    document.getElementById("submitBtn-trs-del").addEventListener("click", submitFormTradeStrategyDelete);
    
    function submitFormTradeStrategyDelete() {
        var form = document.getElementById("form-trs-del");
        var requiredFields = document.getElementById("select-trs-trs-del");
        var missingFields = [];

        if (!requiredFields.value.trim()) {
            missingFields.push(requiredFields.previousElementSibling?.textContent || "Campo obrigatório");
        } 
        if (missingFields.length > 0) {
            alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
            return;
        }

        if (!confirm(`Tem certeza de que deseja deletar a Trade Strategy "${scope.msg.payload.tradeStrategy.acronym}"?`)) {
            return;
        }

        globalThisReference.send({ 
            tradeStrategy_id: scope.msg.payload.tradeStrategy._id, 
            is_delete: true 
        });

        var dropdownTradeStrategies = document.getElementById("select-trs-trs-del");
        var selectedOption = dropdownTradeStrategies.querySelector(`option[value="${scope.msg.payload.tradeStrategy._id}"]`);
        if (selectedOption) selectedOption.remove();

        form.reset();
    }
    
    globalThisReference.$socket.on('msg-input:' + globalThisReference.id, (msg) => {
        console.log('[Trade Strategies - Delete] Inputs:', msg.payload);
        if (msg.payload) {
            populateDropdownsTradeStrategiesDelete(msg.payload);
        }
    });
</script>
