<style>
    .form-trs-updt-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-trs-updt-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-trs-updt-group-destac {
        background: rgb(233, 232, 232);
        width: 93%;
        margin: 0 auto;
        display: block;
        border: 2px solid #007bff;
        padding: 10px;
        border-radius: 5px;
    }
    .form-trs-updt-group-destac-font {
        font-style: italic;
        font-weight: bold;
    }
    .form-trs-updt-group.full-width {
        grid-column: span 2;
    }
    .form-trs-updt-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-trs-updt-group input, 
    .form-trs-updt-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .form-trs-updt-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 5px;
    }
    .form-trs-updt-group input[type="range"] {
        width: 100%;
    }
    .form-trs-updt-group input[type="radio"] {
        margin-right: 5px;
    }
    .submit-trs-updt-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-trs-updt-btn:hover {
        background: #0056b3;
    }
    .parameter-trs-updt-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }
    .parameter-trs-updt-item input, .parameter-trs-updt-item select {
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .remove-trs-updt-btn {
        background: rgba(255, 91, 91, 0.637);
        color: white;
        border: none;
        cursor: pointer;
        padding: 5px;
        border-radius: 4px;
        width: 50%;
        margin: 0 auto;
        display: block;
    }
    .add-btn-trs-updt {
        background: #61b6d8;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }

    .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        color: #007bff;
    }
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        width: 100px;
        height: 100px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        display: block;
    }
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div id="loading-trs-updt" class="loading">
    <div class="spinner"></div>
</div>

<form id="form-trs-updt" class="form-trs-updt-container">
    <div class="form-trs-updt-group form-trs-updt-group-destac full-width">
        <label>Select Trade Strategy:</label>
        <select id="select-trs-trs-updt" style="width: 100%; font-style: italic; font-weight: bold;" required></select>
    </div>
    <hr style="grid-column: span 2; border: 1.5px solid #ccc; margin: 5px 0;">
    <div class="form-trs-updt-group full-width">
        <label>Name:</label>
        <input type="text" id="name-trs-updt" placeholder="Name of the tradeStrategy" required>
    </div>
    <div class="form-trs-updt-group full-width">
        <label>Acronym:</label>
        <input type="text" id="acronym-trs-updt" placeholder="Acronym of the Trade Strategy" required disabled>
    </div>
    <div class="form-trs-updt-group full-width">
        <label>Trade Market:</label>
        <select id="tradeMarket-trs-updt" size="3" multiple required></select>
    </div>
    <div class="form-trs-updt-group full-width">
        <label>Description:</label>
        <textarea id="description-trs-updt" placeholder="Description of the Trade Strategy" rows="3" style="padding: 15px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
    </div>
    <div class="form-trs-updt-group full-width">
        <label>Parameters:</label>
        <div id="parameterContainer-trs-updt"></div>
        <button type="button" class="add-btn-trs-updt" onclick="addParameterTradeStrategiesUpdate()">+ Add Parameter</button>
    </div>
    <div class="form-trs-updt-group full-width">
        <label>Active: <input type="checkbox" id="active-trs-updt"></label>
    </div>

    <button id="submitBtn-trs-updt" type="button" class="form-trs-updt-group submit-trs-updt-btn full-width">Update</button>
</form>

<script>
    const globalThisReference = this;
    var scope = globalThisReference.scope || {};

    function populateDropdownsTradeStrategiesUpdate(inputs) {
        if (inputs.tradeStrategies && inputs.tradeStrategies.options) {
            var dropdownTradeMarkets = document.getElementById("select-trs-trs-updt");
            dropdownTradeMarkets.innerHTML = '<option value="">Select a Trade Strategy to update</option>';
            inputs.tradeStrategies.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeMarkets.appendChild(opt);
            });
        }
        if (inputs.tradeMarkets && inputs.tradeMarkets.options) {
            var dropdownTradeMarket = document.getElementById("tradeMarket-trs-updt");
            dropdownTradeMarket.innerHTML = '';
            inputs.tradeMarkets.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeMarket.appendChild(opt);
            });
            if (inputs.tradeMarkets.selected) {
                inputs.tradeMarkets.selected.forEach(selectedValue => {
                    let option = dropdownTradeMarket.querySelector(`option[value="${selectedValue}"]`);
                    if (option) option.selected = true;
                });
            }
        }
    }
    function getSelectedTradeStrategiesUpdate() {
        let selectedOptions = document.getElementById("tradeMarket-trs-updt").selectedOptions;
        return Array.from(selectedOptions).map(option => option.value);
    }
    function addParameterTradeStrategiesUpdate() {
        var container = document.getElementById("parameterContainer-trs-updt");

        var div = document.createElement("div");
        div.classList.add("parameter-trs-updt-item");
        
        div.innerHTML = `
            <input type="text" placeholder="Name" class="param-trs-updt-name" required>
            <input type="text" placeholder="Key" class="param-trs-updt-key" required>
            <select class="param-trs-updt-type">
                <option value="string">String</option>
                <option value="number">Number</option>
            </select>
            <input type="text" placeholder="Description (optional)" class="param-trs-updt-description">
            <input type="text" placeholder="Value" class="param-trs-updt-value" required>
            <button type="button" class="remove-trs-updt-btn" onclick="removeParameterTradeStrategiesUpdate(this)">❌</button>
        `;
        container.appendChild(div);
    }
    window.addParameterTradeStrategiesUpdate = addParameterTradeStrategiesUpdate;
    function removeParameterTradeStrategiesUpdate(button) {
        button.parentElement.remove();
    }
    window.removeParameterTradeStrategiesUpdate = removeParameterTradeStrategiesUpdate;
    function getParametersTradeStrategiesUpdate() {
        var params = [];
        document.querySelectorAll(".parameter-trs-updt-item").forEach(item => {
            var param = {
                name: item.querySelector(".param-trs-updt-name").value,
                key: item.querySelector(".param-trs-updt-key").value,
                type: item.querySelector(".param-trs-updt-type").value,
                description: item.querySelector(".param-trs-updt-description").value || undefined,
                value: item.querySelector(".param-trs-updt-value").value
            };
            params.push(param);
        });
        return params;
    }

    function populateForm(tradeStrategy) {
        document.getElementById("name-trs-updt").value = tradeStrategy.name || '';
        document.getElementById("acronym-trs-updt").value = tradeStrategy.acronym || '';
        document.getElementById("description-trs-updt").value = tradeStrategy.description || '';
        document.getElementById("active-trs-updt").checked = tradeStrategy.active || '';

        var parameterContainer = document.getElementById("parameterContainer-trs-updt");
        parameterContainer.innerHTML = '';
        if (tradeStrategy.parameters) {
            tradeStrategy.parameters.forEach(param => {
                var div = document.createElement("div");
                div.classList.add("parameter-trs-updt-item");
                div.innerHTML = `
                    <input type="text" placeholder="Name" class="param-trs-updt-name" value="${param.name}" required>
                    <input type="text" placeholder="Key" class="param-trs-updt-key" value="${param.key}" required>
                    <select class="param-trs-updt-type">
                        <option value="string" ${param.type === 'string' ? 'selected' : ''}>String</option>
                        <option value="number" ${param.type === 'number' ? 'selected' : ''}>Number</option>
                    </select>
                    <input type="text" placeholder="Description (optional)" class="param-trs-updt-description" value="${param.description || ''}">
                    <input type="text" placeholder="Value" class="param-trs-updt-value" value="${param.value}" required>
                    <button type="button" class="remove-trs-updt-btn" onclick="removeParameterTradeStrategiesUpdate(this)">❌</button>
                `;
                parameterContainer.appendChild(div);
            });
        }
        var dropdownTradeMarkets = document.getElementById("tradeMarket-trs-updt");
        dropdownTradeMarkets.querySelectorAll("option").forEach(option => option.selected = false);
        if (tradeStrategy.tradeMarket) {
            tradeStrategy.tradeMarket.forEach((strategy) => {
                let option = dropdownTradeMarkets.querySelector(`option[value="${strategy}"]`);
                if (option) option.selected = true;
            });
        }
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    document.getElementById("select-trs-trs-updt").addEventListener("change", loadTradeStrategies);
    
    function loadTradeStrategies() {
        var strategyId = this.value;
        if (strategyId) {
            var loadingElement = document.getElementById("loading-trs-updt");
            loadingElement.style.display = 'block';
            fetch(`http://192.168.99.21:5000/tradeStrategies/${strategyId}`, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('Dados recebidos do servidor:', data);
                populateForm(data);
                scope.msg = scope.msg || {};
                scope.msg.payload = scope.msg.payload || {};
                scope.msg.payload.tradeStrategy = data;
                loadingElement.style.display = 'none';
            })
            .catch(error => {
                console.error('Error fetching tradeStrategy data:', error);
                loadingElement.style.display = 'none';
                if (error.message.includes('Failed to fetch')) {
                    alert('Erro ao conectar ao servidor. Por favor, verifique se o servidor está em execução.');
                }
            });
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        loadTradeStrategies.call(document.getElementById("select-trs-trs-updt"));
    });

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////                

    document.getElementById("submitBtn-trs-updt").addEventListener("click", submitFormTradeStrategiesUpdate);
    
    function submitFormTradeStrategiesUpdate() {
        var form = document.getElementById("form-trs-updt");
        var requiredFields = form.querySelectorAll("[required]");
        var missingFields = [];
        
        requiredFields.forEach(field => {
            if (!field.value.trim()) {
                missingFields.push(field.previousElementSibling?.textContent || "Campo obrigatório");
            }
        });
        if (missingFields.length > 0) {
            alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
            return;
        }            

        var originalData = scope.msg?.payload?.tradeStrategy || {};
        var formData = {};
        var fieldsToCheck = {
            name: "name-trs-updt",
            acronym: "acronym-trs-updt",
            description: "description-trs-updt",
            active: "active-trs-updt"
        };

        Object.keys(fieldsToCheck).forEach(key => {
            var element = document.getElementById(fieldsToCheck[key]);
            var value = element.type === "checkbox" ? element.checked : element.value;
            if (value != originalData[key]) {
                formData[key] = value;
            }
        });
        
        var selectedTradeStrategies = getSelectedTradeStrategiesUpdate();
        if (JSON.stringify(selectedTradeStrategies) !== JSON.stringify(originalData.tradeMarket || [])) {
            formData.tradeMarket = selectedTradeStrategies;
        }

        var parameters = getParametersTradeStrategiesUpdate();
        if (!originalData.parameters || parameters.length !== originalData.parameters.length || 
            parameters.some((param, index) => 
                param.name !== originalData.parameters[index]?.name ||
                param.key !== originalData.parameters[index]?.key ||
                param.type !== originalData.parameters[index]?.type ||
                param.description !== originalData.parameters[index]?.description ||
                param.value !== originalData.parameters[index]?.value)) {
                    formData.parameters = parameters;
                }
                
        if (Object.keys(formData).length === 0) {
            alert("Nenhuma modificação foi detectada no formulário.");
            return;
        }
                
        globalThisReference.send({ 
            tradeStrategy_id: originalData._id,
            body: formData,
            is_delete: false
        });
                
        form.reset();
        document.getElementById("parameterContainer-trs-updt").innerHTML = '';
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////
    
    globalThisReference.$socket.on('msg-input:' + globalThisReference.id, (msg) => {
        console.log('[Trade Strategies - Update] Inputs:', msg.payload);
        if (msg.payload) {
            populateDropdownsTradeStrategiesUpdate(msg.payload);
        }
    });
</script>
