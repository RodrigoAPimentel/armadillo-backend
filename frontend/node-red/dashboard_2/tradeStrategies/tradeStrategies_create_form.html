<style>
    .form-trs-crt-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
    }
    .form-trs-crt-group {
        display: flex;
        flex-direction: column;
        background: white;
        padding: 10px;
        border-radius: 5px;
        box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2);
    }
    .form-trs-crt-group.full-width {
        grid-column: span 2;
    }
    .form-trs-crt-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }
    .form-trs-crt-group input, 
    .form-trs-crt-group select {
        padding: 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .form-trs-crt-group input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin-top: 5px;
    }
    .form-trs-crt-group input[type="range"] {
        width: 100%;
    }
    .form-trs-crt-group input[type="radio"] {
        margin-right: 5px;
    }
    .submit-trs-crt-btn {
        background: #007bff;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
    .submit-trs-crt-btn:hover {
        background: #0056b3;
    }
    .parameter-trs-crt-item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
    }
    .parameter-trs-crt-item input, .parameter-trs-crt-item select {
        padding: 5px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .remove-trs-crt-btn {
        background: rgba(255, 91, 91, 0.637);
        color: white;
        border: none;
        cursor: pointer;
        padding: 5px;
        border-radius: 4px;
        width: 50%;
        margin: 0 auto;
        display: block;
    }
    .add-btn-trs-crt {
        background: #61b6d8;
        color: white;
        font-size: 16px;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s ease;
    }
</style>

<form id="form-trs-crt" class="form-trs-crt-container">
    <div class="form-trs-crt-group full-width">
        <label>Name:</label>
        <input type="text" id="name-trs-crt" placeholder="Name of the Trade Strategy" required>
    </div>
    <div class="form-trs-crt-group full-width">
        <label>Acronym:</label>
        <input type="text" id="acronym-trs-crt" placeholder="Acronym of the Trade Strategy" required>
    </div>
    <div class="form-trs-crt-group full-width">
        <label>Trade Market:</label>
        <select id="tradeMarket-trs-crt" size="3" multiple required></select>
    </div>
    <div class="form-trs-crt-group full-width full-width">
        <label>Description:</label>
        <textarea id="description-trs-crt" placeholder="Description of the Trade Strategy" rows="3" style="padding: 15px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
    </div>
    <div class="form-trs-crt-group full-width">
        <label>Parameters:</label>
        <div id="parameterContainer-trs-crt"></div>
        <button type="button" class="add-btn-trs-crt" onclick="addParameterTradeMarketsCreate()">+ Add Parameter</button>
    </div>
    <div class="form-trs-crt-group full-width">
        <label>Manter dados após envio: <input type="checkbox" id="manterDados-trs-crt"></label>
    </div>

    <button id="submitBtn-trs-crt" type="button" class="form-trs-crt-group submit-trs-crt-btn full-width">Create</button>
</form>

<script>
    const globalThisReference = this; 

    function populateDropdownsTradeStrategiesCreate(inputs) {
        if (inputs.tradeMarkets && inputs.tradeMarkets.options) {
            var dropdownTradeMarket = document.getElementById("tradeMarket-trs-crt");
            dropdownTradeMarket.innerHTML = '';
            inputs.tradeMarkets.options.forEach((option) => {
                var opt = document.createElement("option");
                opt.value = option.value;
                opt.textContent = option.label;
                dropdownTradeMarket.appendChild(opt);
            });
            if (inputs.tradeMarkets.selected) {
                inputs.tradeMarkets.selected.forEach(selectedValue => {
                    let option = dropdownTradeMarket.querySelector(`option[value="${selectedValue}"]`);
                    if (option) option.selected = true;
                });
            }
        }
    }
    function getSelectedTradeMarketsTradeStrategiesCreate() {
        let selectedOptions = document.getElementById("tradeMarket-trs-crt").selectedOptions;
        return Array.from(selectedOptions).map(option => option.value);
    }
    function addParameterTradeMarketsCreate() {
        var container = document.getElementById("parameterContainer-trs-crt");

        var div = document.createElement("div");
        div.classList.add("parameter-trs-crt-item");
        
        div.innerHTML = `
            <input type="text" placeholder="Name" class="param-trs-crt-name" required>
            <input type="text" placeholder="Key" class="param-trs-crt-key" required>
            <select class="param-trs-crt-type">
                <option value="string">String</option>
                <option value="number">Number</option>
            </select>
            <input type="text" placeholder="Description (optional)" class="param-trs-crt-description">
            <input type="text" placeholder="Value" class="param-trs-crt-value" required>
            <button type="button" class="remove-trs-crt-btn" onclick="removeParameterTradeStrategiesCreate(this)">❌</button>
        `;
        container.appendChild(div);
    }
    window.addParameterTradeMarketsCreate = addParameterTradeMarketsCreate;
    function removeParameterTradeStrategiesCreate(button) {
        button.parentElement.remove();
    }
    window.removeParameterTradeStrategiesCreate = removeParameterTradeStrategiesCreate;
    function getParametersTradeStrategiesCreate() {
        var params = [];
        document.querySelectorAll(".parameter-trs-crt-item").forEach(item => {
            var param = {
                name: item.querySelector(".param-trs-crt-name").value,
                key: item.querySelector(".param-trs-crt-key").value,
                type: item.querySelector(".param-trs-crt-type").value,
                description: item.querySelector(".param-trs-crt-description").value || undefined,
                value: item.querySelector(".param-trs-crt-value").value
            };
            params.push(param);
        });
        return params;
    }

    //////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////        

    document.getElementById("submitBtn-trs-crt").addEventListener("click", submitFormTradeStrategiesCreate);

    function submitFormTradeStrategiesCreate() {
        var form = document.getElementById("form-trs-crt");
        var requiredFields = form.querySelectorAll("[required]");
        var missingFields = [];

        requiredFields.forEach(field => {
            if (!field.value.trim()) {
                missingFields.push(field.previousElementSibling?.textContent || "Campo obrigatório");
            }
        });
        if (missingFields.length > 0) {
            alert("Por favor, preencha os seguintes campos obrigatórios:\n- " + missingFields.join("\n- "));
            return;
        }

        var formData = {
            name: document.getElementById("name-trs-crt").value,
            acronym: document.getElementById("acronym-trs-crt").value,
            tradeMarket: getSelectedTradeMarketsTradeStrategiesCreate(),
            description: document.getElementById("description-trs-crt").value,
            parameters: getParametersTradeStrategiesCreate()
        };
        
        globalThisReference.send({ payload: formData });

        if (!document.getElementById("manterDados-trs-crt").checked) {
            form.reset();
            document.getElementById("parameterContainer-trs-crt").innerHTML = '';
        }
    }
    
    globalThisReference.$socket.on('msg-input:' + globalThisReference.id, (msg) => {
        if (msg.payload) {
            populateDropdownsTradeStrategiesCreate(msg.payload);
        }
    });
</script>
